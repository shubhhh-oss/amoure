<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the guest list · AMOURÉ</title>
  <meta name="theme-color" content="#140A0D">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Instrument+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="signup" class="theme-cream">
  <header id="site-header"></header>

  <main class="auth" style="--light: 0.28">
    <div class="auth-scene" aria-hidden="true">
      <div class="auth-glow"></div>
      <div class="auth-arch">
        <video data-auth-video muted playsinline autoplay preload="auto" poster="assets/images/scenes/hero-poster.jpg"></video>
        <video data-auth-video muted playsinline preload="auto"></video>
      </div>
      <p class="auth-hand" >You are invited</p>
      <p class="auth-caption">Slow evenings, saved for you</p>
    </div>

    <div class="auth-panel">
      <div class="auth-card" data-card>
        <span class="auth-seal" data-seal><span>A</span></span>
        <div class="auth-fill">
          <p class="auth-kicker" data-fill>Create an account</p>
          <h1 data-fill>Join the guest list</h1>
          <p class="auth-sub" data-fill>Save your delivery details and keep every order in one place</p>
          <form class="auth-form" data-auth="signup" novalidate data-fill>
            <label class="float">
              <input name="name" type="text" required autocomplete="name" placeholder=" ">
              <span>Full name</span>
            </label>
            <label class="float">
              <input name="email" type="email" required autocomplete="email" placeholder=" ">
              <span>Email</span>
            </label>
            <label class="float">
              <input name="phone" type="tel" autocomplete="tel" placeholder=" " inputmode="tel">
              <span>Phone (optional)</span>
            </label>
            <label class="float has-eye">
              <input name="password" type="password" required autocomplete="new-password" placeholder=" " minlength="8">
              <span>Password</span>
              <button type="button" class="auth-eye" data-eye aria-label="Show password" aria-pressed="false"></button>
            </label>
            <div class="wick" data-wick aria-hidden="true"><i></i></div>
            <p class="auth-hint" data-wick-note>At least 8 characters</p>
            <p class="form-error" data-err role="alert" hidden></p>
            <button class="btn btn-merlot btn-lg btn-full" type="submit">Create account</button>
          </form>
          <p class="auth-switch" data-fill>Already on the list? <a href="signin.html" data-swap>Sign in</a></p>
          <p class="auth-fine" data-fill>Accounts are saved on this device for now</p>
        </div>
        <div class="auth-done" data-done aria-live="polite">
          <p class="auth-done-name" data-done-name></p>
          <p class="auth-done-line">Your name is on the list</p>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/auth-page.js"></script>
</body>
</html>
