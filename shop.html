<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop candles · AMOURÉ</title>
  <meta name="theme-color" content="#140A0D">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Hand-poured scented candles for slow evenings, gifting and romance.">
  <meta property="og:title" content="The collection · AMOURÉ">
  <meta property="og:image" content="assets/images/scenes/hero-poster.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop" class="theme-cream">
  <header id="site-header"></header>

  <main class="page-main">
    <div class="wrap">
      <h1 class="page-title" data-reveal>The collection</h1>
      <p class="page-sub" data-reveal>Six scents for slow evenings, gifting and romance</p>
      <div class="filters" id="filters" role="group" aria-label="Filter by mood"></div>
      <div class="grid" id="products"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const { PRODUCTS, productCard, esc, initReveals } = window.Amoure;
    const MOODS = window.AMOURE_MOODS;
    let mood = new URLSearchParams(location.search).get("mood") || "all";

    function render() {
      const options = [["all", "All"], ...Object.entries(MOODS)];
      document.getElementById("filters").innerHTML = options
        .map(([key, label]) => `<button class="chip" data-mood="${esc(key)}" aria-pressed="${key === mood}">${esc(label)}</button>`)
        .join("");
      const list = mood === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.mood === mood);
      document.getElementById("products").innerHTML =
        list.map(productCard).join("") || `<p class="muted">No candles in this mood yet</p>`;
      initReveals(document.getElementById("products"));
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const b = e.target.closest("[data-mood]");
      if (!b) return;
      mood = b.dataset.mood;
      history.replaceState(null, "", mood === "all" ? "shop.html" : `shop.html?mood=${mood}`);
      render();
    });

    render();
  </script>
</body>
</html>
