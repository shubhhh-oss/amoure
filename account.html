<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account · AMOURÉ</title>
  <meta name="theme-color" content="#140A0D">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="account" class="theme-cream">
  <header id="site-header"></header>

  <main class="page-main">
    <div class="wrap" id="account"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const { Auth, money, esc } = window.Amoure;
    const user = Auth.current();
    if (!user) location.replace("signin.html?next=account.html");
    else {
      const orders = Auth.orders();
      const date = (iso) => new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
      document.getElementById("account").innerHTML = `
        <h1 class="page-title">Hello, ${esc(user.name.split(" ")[0])}</h1>
        <div class="account-grid">
          <section class="panel">
            <h2>Your details</h2>
            <dl class="kv">
              <div><dt>Name</dt><dd>${esc(user.name)}</dd></div>
              <div><dt>Email</dt><dd>${esc(user.email)}</dd></div>
              <div><dt>Phone</dt><dd>${esc(user.phone || "Not added")}</dd></div>
              <div><dt>Member since</dt><dd>${date(user.created)}</dd></div>
            </dl>
            <button class="btn btn-quiet" id="signout">Sign out</button>
          </section>
          <section class="panel">
            <h2>Your orders</h2>
            ${orders.length ? `<ul class="orders">${orders.map((o) => `
              <li>
                <span class="o-id">${esc(o.id)}</span>
                <span class="o-total">${money(o.total)}</span>
                <span class="o-items">${date(o.placed)} · ${o.lines.map((l) => `${esc(l.name)} × ${l.qty}`).join(", ")}</span>
              </li>`).join("")}</ul>`
            : `<div class="empty"><p>No orders yet</p><a class="btn btn-merlot" href="index.html#tray">See the collection</a></div>`}
          </section>
        </div>`;
      document.getElementById("signout").addEventListener("click", () => { Auth.signOut(); location.href = "index.html"; });
    }
  </script>
</body>
</html>
